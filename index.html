<!DOCTYPE html>

<head>

  <title>Varad Palod · Software Development Engineer</title>
  <meta name="description" content="Portfolio of Varad Palod, a software engineer building secure backends, applied machine learning and data products." />
  <meta name="theme-color" content="#fff7fb" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0f1020');
      } catch (e) {}
    })();
  </script>
